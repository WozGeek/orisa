
version: '3.8'
services:
  api:
    image: python:3.11
    volumes:
      - ./backend:/app
    working_dir: /app
    command: bash -c "pip install -r requirements.txt && uvicorn main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - XAI_API_KEY=${XAI_API_KEY}
      - X_API_KEY=${X_API_KEY}
